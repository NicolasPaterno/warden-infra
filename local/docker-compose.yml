services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: warden-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: warden-nats
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring
    command: ["--http_port", "8222", "--jetstream"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: warden-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-migrate:
    image: migrate/migrate:v4.18.1
    container_name: warden-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../warden-auth/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:warden@postgres:5432/warden_auth_db?sslmode=disable"
      - "up"
    restart: "no"

  auth:
    build: ../../warden-auth
    container_name: warden-auth
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:warden@postgres:5432/warden_auth_db?sslmode=disable
      HTTP_PORT: ":8082"
      PRIVATE_KEY_PATH: /etc/auth/keys/private.pem
      ISSUER: warden-auth
      AUDIENCE: warden-engine
    ports:
      - "8082:8082"
    volumes:
      # Dev signing key mounted read-only. In prod this comes from a secret.
      - ../../warden-auth/dev-private.pem:/etc/auth/keys/private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: warden-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: warden-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: warden
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: warden-jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: warden-local
