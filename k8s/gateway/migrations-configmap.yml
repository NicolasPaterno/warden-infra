apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-migrations
  namespace: warden
data:
  000001_create_readings.up.sql: |
    CREATE TABLE IF NOT EXISTS readings (
        sensor_id   TEXT        NOT NULL,
        room        TEXT        NOT NULL,
        type        TEXT        NOT NULL,
        value       FLOAT8      NOT NULL,
        unit        TEXT        NOT NULL,
        time        TIMESTAMPTZ NOT NULL
    );

    SELECT create_hypertable('readings', 'time', if_not_exists => TRUE);

  000001_create_readings.down.sql: |
    DROP TABLE IF EXISTS readings;

  000002_add_tenant.up.sql: |
    ALTER TABLE readings ADD COLUMN IF NOT EXISTS tenant_id TEXT NOT NULL DEFAULT '';

    CREATE INDEX IF NOT EXISTS idx_readings_tenant
        ON readings (tenant_id, room, type, time DESC);

  000002_add_tenant.down.sql: |
    DROP INDEX IF EXISTS idx_readings_tenant;

    ALTER TABLE readings DROP COLUMN IF EXISTS tenant_id;
