apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-gateway
  namespace: warden
  labels:
    app: warden-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warden-gateway
  template:
    metadata:
      labels:
        app: warden-gateway
    spec:
      containers:
        - name: gateway
          image: warden-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
