apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-engine
  namespace: warden
  labels:
    app: warden-engine
spec:
  # The subscriber joins the "warden-engine" NATS queue group, so each reading
  # is delivered to only one replica — scaling out is safe (no duplicate
  # alerts). The HorizontalPodAutoscaler owns the live replica count; this is
  # just the initial value, kept in sync with the HPA's minReplicas.
  replicas: 1
  selector:
    matchLabels:
      app: warden-engine
  template:
    metadata:
      labels:
        app: warden-engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/nicolaspaterno/warden-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: engine-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: engine-secret
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
