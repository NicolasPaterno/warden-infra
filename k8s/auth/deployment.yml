apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-auth
  namespace: warden
  labels:
    app: warden-auth
spec:
  # Stateless token issuer: every replica loads the SAME private key from the
  # auth-keys Secret, so any replica can sign and the others' tokens stay valid.
  # The key is never generated at startup. The HPA owns the live replica count.
  replicas: 1
  selector:
    matchLabels:
      app: warden-auth
  template:
    metadata:
      labels:
        app: warden-auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/nicolaspaterno/warden-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: auth-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: database-url
          volumeMounts:
            - name: signing-key
              mountPath: /etc/auth/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: signing-key
          secret:
            secretName: auth-keys
            items:
              - key: private.pem
                path: private.pem
