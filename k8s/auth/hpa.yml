apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: warden-auth
  namespace: warden
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: warden-auth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
